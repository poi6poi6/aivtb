<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>助手 · 一笔一画</title><style>
*{box-sizing:border-box}body{margin:0;background:#14271f;color:#e8ddbd;font:16px/1.6 system-ui}main{max-width:1280px;margin:auto;padding:24px}header,.controls{display:flex;align-items:center;gap:16px;flex-wrap:wrap}header{justify-content:space-between}h1{font:28px Georgia,serif;letter-spacing:3px}a{color:inherit}button,select,textarea{padding:9px 18px;background:#284738;color:inherit;border:1px solid #70816a;border-radius:24px;font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:default}.paper{position:relative;margin:20px 0;line-height:0;border-radius:18px;overflow:hidden;background:#fffaf0;box-shadow:0 16px 60px #0004}canvas{width:100%;height:auto;display:block}#status{min-height:26px}progress{width:100%;accent-color:#a8c897;height:8px}small{color:#b6c5ad}.clean main{padding:0;max-width:none}.clean header,.clean .controls,.clean progress,.clean #status,.clean small{display:none}.clean .paper{margin:0;border-radius:0;box-shadow:none}.clean canvas{width:100vw;height:100vh;object-fit:contain}.clean body{background:transparent}.clean #revision-panel{display:none}textarea{display:block;width:100%;min-height:88px;border-radius:12px;resize:vertical}#revision-panel{margin-top:20px}button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #d9d5a3;outline-offset:3px}@media(max-width:600px){main{padding:12px}.controls{gap:8px}h1{font-size:22px}}
</style><main><header><h1 id="title">✳ 助手 · 一笔一画</h1><a href="/tasks">回到工作室</a></header><div class="paper"><canvas id="paper" width="1000" height="750" aria-label="逐笔绘画画布"></canvas></div><progress id="progress" value="0" max="1"></progress><p id="status" role="status">正在准备画布…</p><div class="controls"><button id="play" disabled>开始画</button><button id="restart" disabled>从头重画</button><label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label><button id="save" disabled>保存当前画面</button><a id="clean" target="_blank" rel="noopener">直播纯画布</a></div><section id="revision-panel" hidden><h2>一起把画完善</h2><p>先看草稿构图，可以修改草稿，或带着修改要求继续上色。</p><textarea id="instruction" maxlength="1000" placeholder="例如：眼睛小一点，背景换成夜景" aria-label="绘画修改要求"></textarea><div class="controls"><button id="revise">预览修改</button><button id="finish">继续上色与细节</button><button id="confirm-change" hidden>确认这次修改</button></div><p id="change-status" role="status"></p></section><small>控制台与直播纯画布共享播放进度。新版本准备好后同步替换并暂停，点击继续画开始播放；断线时暂停，重连后同步。</small></main><script src="/static/drawing-player.js"></script><script src="/static/drawing.js"></script></html>
